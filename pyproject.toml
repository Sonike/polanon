[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "polanon"
dynamic = ["version"]
description = "Reversible PII masking for LLM calls, Polish-first: checksum-validated PESEL, NIP, REGON and IBAN, Polish names in every case, stable tokens and streaming restore."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "BoroMat" }]
requires-python = ">=3.11"
# The standard library is the whole core. Everything heavier is an extra.
dependencies = []
keywords = [
    "pii",
    "anonymization",
    "pseudonymization",
    "gdpr",
    "rodo",
    "llm",
    "privacy",
    "polish",
    "pesel",
    "nip",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Natural Language :: Polish",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]

[project.optional-dependencies]
# Names, places and organisations without a legal form. Also needs the model:
#     python -m spacy download pl_core_news_md
ner = ["spacy>=3.7"]
# The Ollama and remote stage-2 judges.
judge = ["httpx>=0.27"]
# Components for Haystack 3 pipelines: polanon.integrations.haystack.
haystack = ["haystack-ai>=3.0,<4"]
# Tests, lint and types. The recipes in examples/ are tested against the real provider SDKs when
# those are installed (pip install anthropic openai), and skipped when they are not.
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "httpx>=0.27",
]

[project.scripts]
polanon = "polanon.__main__:main"

[project.urls]
Homepage = "https://github.com/boromat/polanon"
Source = "https://github.com/boromat/polanon"
Issues = "https://github.com/boromat/polanon/issues"
Changelog = "https://github.com/boromat/polanon/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = { attr = "polanon.__version__" }

[tool.setuptools.packages.find]
include = ["polanon*"]

[tool.setuptools.package-data]
polanon = ["py.typed"]

[tool.ruff]
line-length = 100
# The library supports Python 3.11, so ruff must neither suggest nor accept 3.12-only syntax.
target-version = "py311"

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I isort, UP pyupgrade, B bugbear, SIM simplify, C4 comprehensions,
# N naming, D docstrings (Google style), S bandit security, RUF ruff-specific, PT pytest style, ANN annotations
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "N", "D", "S", "RUF", "PT", "ANN"]
ignore = [
    "D100", "D104",          # module/package docstrings optional (package docstrings exist where useful)
    "D203", "D213",          # conflicting docstring styles; we use D211 + D212
    "ANN401",                # Any allowed in rare interop spots
    "S101",                  # assert is fine in tests (and guarded invariants)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN", "S105", "S106"]
# The judges import httpx when they load, so they are imported after the skip that checks for it.
"tests/test_judges.py" = ["E402"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
ignore_missing_imports = true   # spaCy ships partial stubs
exclude = ["build/", ".venv/"]

[[tool.mypy.overrides]]
# Haystack is an extra: where it is not installed, its decorators and helpers read as untyped.
# The haystack job in CI checks this module with Haystack installed, under every strict rule.
module = ["polanon.integrations.haystack"]
disallow_untyped_decorators = false
warn_return_any = false

[tool.coverage.run]
source = ["polanon"]
branch = true
# Measured in the haystack job, where Haystack is installed: tests/haystack.coveragerc.
omit = ["polanon/integrations/haystack.py"]

[tool.coverage.report]
# A floor, not a target: the suite sits well above it, and this is what stops it sliding back.
fail_under = 90
show_missing = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers"
markers = ["slow: needs the spaCy model or network"]
